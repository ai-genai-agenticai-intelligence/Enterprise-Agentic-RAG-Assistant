services:
  - type: web
    name: enterprise-agentic-rag-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_FALLBACK_API_KEY
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false
      - key: PORTKEY_API_KEY
        sync: false
      - key: PORTKEY_CONFIG_ID
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_GUARD_MODEL
        value: openai/gpt-oss-20b
